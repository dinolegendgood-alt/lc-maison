<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工藝選集 | 龍策 DETAILING</title>
    <meta name="description" content="探索龍策 DETAILING 的三大工藝等級。從城市精洗、結晶鍍膜到旗艦漆面防護，為您的愛車選擇最完整的守護方案。">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .collections-hero { min-height: 45vh; padding-top: 160px; padding-bottom: 60px; }
        .collections-hero h1 { font-family: var(--font-serif); font-size: 5vw; font-weight: 400; line-height: 1.1; margin-bottom: 20px; }
        .collections-subtitle { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.25rem; max-width: 500px; line-height: 1.7; margin-top: 20px; }

        .services-wrapper { padding: 0 var(--p-side) 120px; }

        .service-item {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 80px 0;
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 80px;
            align-items: start;
        }
        .service-item:last-child { border-bottom: 1px solid rgba(255,255,255,0.1); }

        .service-num {
            font-family: var(--font-serif);
            font-size: 7rem;
            font-weight: 900;
            line-height: 1;
            color: rgba(255,255,255,0.05);
            letter-spacing: -0.02em;
            user-select: none;
        }
        .service-tag { display: block; font-size: 0.62rem; letter-spacing: 0.45rem; color: var(--muted); text-transform: uppercase; margin-bottom: 18px; }
        .service-name { font-family: var(--font-serif); font-size: 2.8rem; font-weight: 400; line-height: 1.1; margin-bottom: 8px; }
        .service-name-en { font-size: 0.75rem; letter-spacing: 0.35rem; color: var(--muted); text-transform: uppercase; margin-bottom: 35px; display: block; }
        .service-desc { font-size: 0.95rem; color: var(--muted); line-height: 1.85; max-width: 580px; margin-bottom: 40px; }

        .service-includes { list-style: none; margin-bottom: 45px; max-width: 520px; }
        .service-includes li { display: flex; align-items: center; gap: 18px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 0.88rem; color: rgba(255,255,255,0.75); }
        .service-includes li::before { content: ''; width: 18px; height: 1px; background: rgba(255,255,255,0.25); flex-shrink: 0; }
        .service-includes li.highlight { color: rgba(255,255,255,0.95); }
        .service-includes li.highlight::before { background: rgba(255,255,255,0.6); }

        .service-footer { display: flex; align-items: center; gap: 40px; flex-wrap: wrap; }
        .service-price-label { font-size: 0.62rem; letter-spacing: 0.3rem; color: var(--muted); text-transform: uppercase; }
        .service-price-val { font-size: 0.9rem; color: rgba(255,255,255,0.6); margin-top: 4px; }
        .service-btn { display: inline-block; padding: 16px 40px; border: 1px solid rgba(255,255,255,0.35); color: #fff; text-decoration: none; font-size: 0.7rem; letter-spacing: 0.35rem; text-transform: uppercase; transition: 0.4s var(--ease-silk); }
        .service-btn:hover { background: #fff; color: #000; border-color: #fff; }

        .guarantee-strip { background: rgba(255,255,255,0.03); border-top: 1px solid rgba(255,255,255,0.07); border-bottom: 1px solid rgba(255,255,255,0.07); padding: 50px var(--p-side); display: flex; justify-content: space-around; flex-wrap: wrap; gap: 30px; }
        .guarantee-item { text-align: center; }
        .guarantee-num { font-family: var(--font-serif); font-size: 2.5rem; font-weight: 400; margin-bottom: 8px; }
        .guarantee-label { font-size: 0.65rem; letter-spacing: 0.25rem; color: var(--muted); text-transform: uppercase; }

        .loading-msg { text-align: center; padding: 100px var(--p-side); color: rgba(255,255,255,0.2); font-size: 0.8rem; letter-spacing: 0.3rem; }

        @media (max-width: 1024px) { .service-item { grid-template-columns: 120px 1fr; gap: 50px; } .service-num { font-size: 5rem; } }
        @media (max-width: 768px) {
            .collections-hero { min-height: auto; }
            .collections-hero h1 { font-size: 2.5rem; }
            .services-wrapper { padding: 0 var(--p-side) 80px; }
            .service-item { grid-template-columns: 1fr; gap: 0; padding: 50px 0; }
            .service-num { font-size: 4rem; margin-bottom: 20px; }
            .service-name { font-size: 2rem; }
            .service-footer { flex-direction: column; gap: 20px; }
            .service-btn { width: 100%; text-align: center; }
            .guarantee-strip { padding: 40px var(--p-side); }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="brand">龍策 DETAILING</a>
        <button id="menuTrigger" class="nav-hamburger" aria-label="選單">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-links">
            <a href="index.html" class="bilingual-link"><span class="bilingual-inner"><span class="en">Home</span><span class="zh">品牌首頁</span></span></a>
            <a href="glow.html" class="bilingual-link"><span class="bilingual-inner"><span class="en">Collections</span><span class="zh">工藝選集</span></span></a>
            <a href="drop.html" class="bilingual-link"><span class="bilingual-inner"><span class="en">Archives</span><span class="zh">典藏實錄</span></span></a>
            <a href="booking.html" class="bilingual-link"><span class="bilingual-inner"><span class="en">Booking</span><span class="zh">立即預約</span></span></a>
        </div>
    </nav>

    <main>
        <section class="collections-hero reveal-maison">
            <span style="font-size:0.65rem;letter-spacing:0.5rem;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:25px;">工藝選集 / THE COLLECTIONS</span>
            <h1>為愛車選擇<br>最合適的守護</h1>
            <p class="collections-subtitle">三種等級的專業工藝方案，從日常養護到頂級防護，每一項都是龍策對品質的完整承諾。</p>
        </section>

        <div id="services-wrapper" class="services-wrapper">
            <div class="loading-msg">載入中...</div>
        </div>

        <div class="guarantee-strip reveal-maison">
            <div class="guarantee-item"><div class="guarantee-num">12+</div><div class="guarantee-label">品牌深耕年數</div></div>
            <div class="guarantee-item"><div class="guarantee-num">500+</div><div class="guarantee-label">服務完工案例</div></div>
            <div class="guarantee-item"><div class="guarantee-num">9H</div><div class="guarantee-label">頂級鍍膜硬度</div></div>
            <div class="guarantee-item"><div class="guarantee-num">36M</div><div class="guarantee-label">最長保固月數</div></div>
        </div>
    </main>

    <script>
    const SUPABASE_URL = 'https://dgepltmxtbwbfalqgnqv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnZXBsdG14dGJ3YmZhbHFnbnF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MDU2NzIsImV4cCI6MjA5NjA4MTY3Mn0.pqGMLBJGBc4apgLIZCnIVGiVaq4XN6Zqws15wC1sZQ4';
    const BOOKING_URL = 'https://www.ezpretty.com.tw/ezpretty/ezpretty/login?es=5545d31e706480f49bb20ba65548e6ca&redirect=/ezpretty/aio%23/5545d31e706480f49bb20ba65548e6ca';

    async function loadCollections() {
        const wrapper = document.getElementById('services-wrapper');
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/collections?order=id.asc`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const data = await res.json();
            if (!res.ok || !data.length) throw new Error();

            wrapper.innerHTML = data.map((c, i) => `
                <div class="service-item reveal-maison">
                    <div class="service-num">${String(i+1).padStart(2,'0')}</div>
                    <div>
                        <span class="service-tag">${c.tag}</span>
                        <h2 class="service-name">${c.name_zh}</h2>
                        <span class="service-name-en">${c.name_en}</span>
                        <p class="service-desc">${c.description}</p>
                        <ul class="service-includes">
                            ${(c.includes || []).map((item, idx) =>
                                `<li class="${idx === 0 && i > 0 ? 'highlight' : idx === (c.includes.length-1) && c.includes[idx].includes('保固') ? 'highlight' : ''}">${item}</li>`
                            ).join('')}
                        </ul>
                        <div class="service-footer">
                            <div>
                                <div class="service-price-label">參考報價</div>
                                <div class="service-price-val">歡迎洽詢</div>
                            </div>
                            <a href="${BOOKING_URL}" target="_blank" rel="noopener" class="service-btn">預約此項服務</a>
                        </div>
                    </div>
                </div>`).join('');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('is-visible'); });
            }, { threshold: 0.1 });
            wrapper.querySelectorAll('.reveal-maison').forEach(el => observer.observe(el));

        } catch(e) {
            wrapper.innerHTML = '<div class="loading-msg">內容載入失敗，請稍後再試</div>';
        }
    }

    loadCollections();
    </script>
    <script src="assets/js/main.js"></script>
</body>
</html>
