<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工藝選集 Collections | LC MAISON</title>
    <meta name="description" content="探索 LC MAISON 的年度工藝選集。從城市焦點精洗到旗艦漆面防護，我們為您的愛車提供最高等級的視覺與物理防護。">
    <meta property="og:title" content="工藝選集 | LC MAISON">
    <meta property="og:description" content="探索年度工藝選集，啟動閣下的美學任務。">
    <meta property="og:image" content="https://images.unsplash.com/photo-1544636331-e26879cd4d9b?q=80&w=1200">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .collection-list { margin-top: 100px; }
        .collection-item {
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 100px 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            text-decoration: none;
            color: var(--text);
            transition: 0.6s var(--ease-silk);
        }
        .collection-item:hover { padding-left: 30px; border-bottom-color: #fff; }
        .collection-name { font-family: var(--font-serif); font-size: 4rem; font-weight: 400; }
        .collection-meta { font-size: 0.8rem; letter-spacing: 0.3rem; color: var(--muted); text-transform: uppercase; margin-bottom: 15px; display: block; }
        @media (max-width: 768px) {
            .collection-name { font-size: 2rem; }
            .collection-item { flex-direction: column; align-items: flex-start; padding: 60px 0; }
        }
    </style>
</head>
<body>


    <nav>
        <a href="index.html" class="brand">LC MAISON</a>
        <div class="nav-links">
            <a href="index.html" class="bilingual-link">
                <span class="bilingual-inner">
                    <span class="en">The Maison</span>
                    <span class="zh">品牌首頁</span>
                </span>
            </a>
            <a href="glow.html" class="bilingual-link">
                <span class="bilingual-inner">
                    <span class="en">Collections</span>
                    <span class="zh">工藝選集</span>
                </span>
            </a>
            <a href="drop.html" class="bilingual-link">
                <span class="bilingual-inner">
                    <span class="en">Archives</span>
                    <span class="zh">典藏實錄</span>
                </span>
            </a>
            <a href="booking.html" class="bilingual-link">
                <span class="bilingual-inner">
                    <span class="en">Appointments</span>
                    <span class="zh">私人預約</span>
                </span>
            </a>
        </div>
    </nav>

    <main>
        <section>
            <div class="reveal-maison">
                <span class="bilingual-text" style="font-size: 0.8rem; letter-spacing: 0.8rem; color: var(--muted); text-transform: uppercase; display: block; margin-bottom: 30px;">
                    <span class="bilingual-inner">
                        <span class="en">The Collections</span>
                        <span class="zh">年度工藝選集</span>
                    </span>
                </span>
                <h1 class="maison-title" style="font-size: 6vw;">工藝選集</h1>
            </div>

            <div class="collection-list">
                <a href="booking.html" class="collection-item reveal-maison">
                    <div>
                        <span class="collection-meta">Collection 01 / Gloss</span>
                        <h2 class="collection-name">城市焦點精洗</h2>
                    </div>
                    <span class="collection-meta bilingual-text">
                        <span class="bilingual-inner">
                            <span class="en">Explore Details —</span>
                            <span class="zh">探索工藝細節</span>
                        </span>
                    </span>
                </a>

                <a href="booking.html" class="collection-item reveal-maison">
                    <div>
                        <span class="collection-meta">Collection 02 / Shield</span>
                        <h2 class="collection-name">結晶美學鍍膜</h2>
                    </div>
                    <span class="collection-meta bilingual-text">
                        <span class="bilingual-inner">
                            <span class="en">Explore Details —</span>
                            <span class="zh">探索工藝細節</span>
                        </span>
                    </span>
                </a>

                <a href="booking.html" class="collection-item reveal-maison">
                    <div>
                        <span class="collection-meta">Collection 03 / Armor</span>
                        <h2 class="collection-name">旗艦漆面防護</h2>
                    </div>
                    <span class="collection-meta bilingual-text">
                        <span class="bilingual-inner">
                            <span class="en">Explore Details —</span>
                            <span class="zh">探索工藝細節</span>
                        </span>
                    </span>
                </a>
            </div>
        </section>
    </main>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('is-visible');
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal-maison').forEach(el => observer.observe(el));
    </script>
</body>
</html>
