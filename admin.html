<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理後台 | 龍策 DETAILING</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; }

        #gate { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 20px; }
        #gate h1 { font-size: 1.2rem; letter-spacing: 0.4rem; margin-bottom: 10px; }
        #gate input { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 15px 25px; font-size: 1rem; width: 300px; text-align: center; outline: none; }
        #gate button { background: #fff; color: #000; border: none; padding: 15px 40px; font-size: 0.8rem; letter-spacing: 0.3rem; cursor: pointer; text-transform: uppercase; font-weight: 700; }
        #gate button:hover { background: #ddd; }

        #panel { display: none; padding: 40px; max-width: 1200px; margin: 0 auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; margin-bottom: 40px; }
        .admin-header h1 { font-size: 0.9rem; letter-spacing: 0.4rem; }
        .logout-btn { background: transparent; color: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.2); padding: 8px 20px; cursor: pointer; font-size: 0.7rem; letter-spacing: 0.2rem; }

        .tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 40px; }
        .tab-btn { background: transparent; color: rgba(255,255,255,0.4); border: none; border-bottom: 2px solid transparent; padding: 15px 30px; cursor: pointer; font-size: 0.75rem; letter-spacing: 0.2rem; text-transform: uppercase; transition: 0.3s; }
        .tab-btn.active { color: #fff; border-bottom-color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .upload-zone { border: 1px dashed rgba(255,255,255,0.15); padding: 60px; text-align: center; cursor: pointer; transition: 0.3s; margin-bottom: 40px; }
        .upload-zone:hover { border-color: rgba(255,255,255,0.4); }
        .upload-zone p { color: rgba(255,255,255,0.4); font-size: 0.8rem; letter-spacing: 0.2rem; }
        .upload-zone input { display: none; }

        .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .img-card { position: relative; aspect-ratio: 1; overflow: hidden; background: rgba(255,255,255,0.05); }
        .img-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .img-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.75); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; opacity: 0; transition: 0.3s; padding: 10px; }
        .img-card:hover .img-overlay { opacity: 1; }
        .img-name { font-size: 0.65rem; color: rgba(255,255,255,0.5); text-align: center; word-break: break-all; }
        .copy-btn { background: #fff; color: #000; border: none; padding: 8px 18px; cursor: pointer; font-size: 0.7rem; letter-spacing: 0.1rem; font-weight: 700; }
        .del-img-btn { background: transparent; color: #ff6666; border: 1px solid #ff6666; padding: 6px 14px; cursor: pointer; font-size: 0.68rem; }

        .msg { padding: 14px 20px; margin-bottom: 25px; font-size: 0.78rem; letter-spacing: 0.1rem; }
        .msg-success { border: 1px solid rgba(0,200,100,0.4); color: rgb(0,200,100); background: rgba(0,200,100,0.05); }
        .msg-error { border: 1px solid rgba(255,68,68,0.4); color: #ff6666; background: rgba(255,68,68,0.05); }
        .msg-info { border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.5); }
        .placeholder { color: rgba(255,255,255,0.25); text-align: center; padding: 60px; font-size: 0.8rem; letter-spacing: 0.2rem; }

        /* Collections editor */
        .col-card { border: 1px solid rgba(255,255,255,0.1); padding: 30px; margin-bottom: 25px; }
        .col-card h3 { font-size: 0.8rem; letter-spacing: 0.3rem; margin-bottom: 25px; color: rgba(255,255,255,0.6); text-transform: uppercase; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.62rem; letter-spacing: 0.25rem; color: rgba(255,255,255,0.4); text-transform: uppercase; margin-bottom: 8px; }
        .form-group input, .form-group textarea {
            width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12);
            color: #fff; padding: 12px 15px; font-size: 0.88rem; outline: none; font-family: 'Inter', sans-serif;
            transition: 0.3s; resize: vertical;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: rgba(255,255,255,0.4); }
        .form-group textarea { min-height: 120px; line-height: 1.7; }
        .save-btn { background: #fff; color: #000; border: none; padding: 12px 35px; font-size: 0.75rem; letter-spacing: 0.3rem; cursor: pointer; text-transform: uppercase; font-weight: 700; transition: 0.3s; }
        .save-btn:hover { background: #ddd; }
        .form-hint { font-size: 0.65rem; color: rgba(255,255,255,0.25); margin-top: 6px; letter-spacing: 0.1rem; }

        @media (max-width: 768px) { #panel { padding: 20px; } }
    </style>
</head>
<body>

<div id="gate">
    <h1>龍策 DETAILING / ADMIN</h1>
    <input type="password" id="pwInput" placeholder="輸入管理密碼" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">進入後台</button>
    <p id="gateErr" style="color:#ff4444;font-size:0.75rem;letter-spacing:0.1rem;display:none;margin-top:5px;">密碼錯誤</p>
</div>

<div id="panel">
    <div class="admin-header">
        <h1>龍策 DETAILING &nbsp;/&nbsp; 管理後台</h1>
        <button class="logout-btn" onclick="logout()">登出</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('archives',this)">典藏照片</button>
        <button class="tab-btn" onclick="switchTab('collections',this)">工藝選集</button>
        <button class="tab-btn" onclick="switchTab('images',this)">圖片庫</button>
    </div>

    <!-- 典藏照片 -->
    <div id="tab-archives" class="tab-content active">
        <div id="arc-msg"></div>
        <p style="font-size:0.78rem;color:rgba(255,255,255,0.4);margin-bottom:25px;line-height:1.8;">
            上傳的照片會自動顯示在網站「典藏實錄」頁面，刪除後也會同步移除。
        </p>
        <div class="upload-zone" onclick="document.getElementById('arcInput').click()">
            <p>點擊上傳典藏照片</p>
            <p style="margin-top:12px;font-size:0.65rem;">支援 JPG、PNG、WebP，可多選</p>
            <input type="file" id="arcInput" accept="image/*" multiple onchange="uploadArchives(this.files)">
        </div>
        <div class="img-grid" id="arc-grid">
            <div class="placeholder" style="grid-column:1/-1">載入中...</div>
        </div>
    </div>

    <!-- 工藝選集 -->
    <div id="tab-collections" class="tab-content">
        <div id="col-msg"></div>
        <div id="col-editor"><div class="placeholder">載入中...</div></div>
    </div>

    <!-- 圖片庫 -->
    <div id="tab-images" class="tab-content">
        <div id="img-msg"></div>
        <p style="font-size:0.78rem;color:rgba(255,255,255,0.4);margin-bottom:25px;line-height:1.8;">
            上傳圖片後複製網址，告訴我要放在哪個頁面，我幫你更新。
        </p>
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <p>點擊上傳圖片</p>
            <p style="margin-top:12px;font-size:0.65rem;">支援 JPG、PNG、WebP，可多選</p>
            <input type="file" id="fileInput" accept="image/*" multiple onchange="uploadImages(this.files)">
        </div>
        <div class="img-grid" id="img-grid">
            <div class="placeholder" style="grid-column:1/-1">載入中...</div>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://dgepltmxtbwbfalqgnqv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnZXBsdG14dGJ3YmZhbHFnbnF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MDU2NzIsImV4cCI6MjA5NjA4MTY3Mn0.pqGMLBJGBc4apgLIZCnIVGiVaq4XN6Zqws15wC1sZQ4';
const ADMIN_PW = 'lcmaison2026';
const BUCKET = 'images';
const ARC_PREFIX = 'archives/';
const sh = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' };
const delH = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` };

function login() {
    if (document.getElementById('pwInput').value === ADMIN_PW) {
        localStorage.setItem('lc_admin', '1');
        show();
    } else {
        document.getElementById('gateErr').style.display = 'block';
    }
}
function logout() { localStorage.removeItem('lc_admin'); location.reload(); }
function show() {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    loadArchives();
}
if (localStorage.getItem('lc_admin') === '1') show();

function switchTab(name, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
    if (name === 'archives') loadArchives();
    if (name === 'collections') loadCollections();
    if (name === 'images') loadImages();
}

function showMsg(id, text, type) {
    document.getElementById(id).innerHTML = `<div class="msg msg-${type}">${text}</div>`;
}

// --- 典藏照片 ---
async function loadArchives() {
    const grid = document.getElementById('arc-grid');
    grid.innerHTML = '<div class="placeholder" style="grid-column:1/-1">載入中...</div>';
    try {
        const res = await fetch(`${SUPABASE_URL}/storage/v1/object/list/${BUCKET}`, {
            method: 'POST', headers: sh,
            body: JSON.stringify({ limit: 200, offset: 0, prefix: ARC_PREFIX, sortBy: { column: 'created_at', order: 'desc' } })
        });
        const data = await res.json();
        if (!res.ok || !Array.isArray(data)) { grid.innerHTML = '<div class="placeholder" style="grid-column:1/-1;color:#ff6666;">載入失敗，請確認 Storage 權限</div>'; return; }
        const files = data.filter(f => f.name && f.name !== '.emptyFolderPlaceholder');
        if (!files.length) { grid.innerHTML = '<div class="placeholder" style="grid-column:1/-1">尚無典藏照片，請上傳</div>'; return; }
        grid.innerHTML = files.map(f => {
            const url = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${ARC_PREFIX}${f.name}`;
            return `<div class="img-card"><img src="${url}" loading="lazy">
                <div class="img-overlay">
                    <p class="img-name">${f.name}</p>
                    <button class="del-img-btn" onclick="delArchive('${f.name}')">刪除</button>
                </div></div>`;
        }).join('');
    } catch(e) { grid.innerHTML = `<div class="placeholder" style="grid-column:1/-1;color:#ff6666;">${e.message}</div>`; }
}

async function uploadArchives(files) {
    showMsg('arc-msg', `上傳中（0/${files.length}）...`, 'info');
    let ok = 0;
    for (const file of files) {
        const ext = file.name.split('.').pop();
        const name = `${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
        const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${ARC_PREFIX}${name}`, {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': file.type },
            body: file
        });
        if (res.ok) { ok++; showMsg('arc-msg', `上傳中（${ok}/${files.length}）...`, 'info'); }
        else { showMsg('arc-msg', '上傳失敗', 'error'); return; }
    }
    showMsg('arc-msg', `${ok} 張照片上傳成功，典藏實錄已更新`, 'success');
    setTimeout(() => document.getElementById('arc-msg').innerHTML = '', 5000);
    document.getElementById('arcInput').value = '';
    loadArchives();
}

async function delArchive(name) {
    if (!confirm('確定刪除此照片？')) return;
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${ARC_PREFIX}${name}`, {
        method: 'DELETE', headers: delH
    });
    if (!res.ok) { const e = await res.json().catch(()=>{}); alert('刪除失敗：' + (e?.message || res.status)); return; }
    loadArchives();
}

// --- 圖片庫 ---
async function loadImages() {
    const grid = document.getElementById('img-grid');
    grid.innerHTML = '<div class="placeholder" style="grid-column:1/-1">載入中...</div>';
    try {
        const res = await fetch(`${SUPABASE_URL}/storage/v1/object/list/${BUCKET}`, {
            method: 'POST', headers: sh,
            body: JSON.stringify({ limit: 200, offset: 0, sortBy: { column: 'created_at', order: 'desc' } })
        });
        const data = await res.json();
        if (!res.ok || !Array.isArray(data)) { grid.innerHTML = '<div class="placeholder" style="grid-column:1/-1;color:#ff6666;">載入失敗</div>'; return; }
        const files = data.filter(f => f.name && !f.name.startsWith('archives/') && f.name !== '.emptyFolderPlaceholder');
        if (!files.length) { grid.innerHTML = '<div class="placeholder" style="grid-column:1/-1">尚無圖片，請上傳</div>'; return; }
        grid.innerHTML = files.map(f => {
            const url = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${f.name}`;
            return `<div class="img-card"><img src="${url}" loading="lazy">
                <div class="img-overlay">
                    <p class="img-name">${f.name}</p>
                    <button class="copy-btn" onclick="copyUrl('${url}')">複製網址</button>
                    <button class="del-img-btn" onclick="delImg('${f.name}')">刪除</button>
                </div></div>`;
        }).join('');
    } catch(e) { grid.innerHTML = `<div class="placeholder" style="grid-column:1/-1;color:#ff6666;">${e.message}</div>`; }
}

async function uploadImages(files) {
    showMsg('img-msg', `上傳中（0/${files.length}）...`, 'info');
    let ok = 0;
    for (const file of files) {
        const ext = file.name.split('.').pop();
        const name = `${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
        const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${name}`, {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': file.type },
            body: file
        });
        if (res.ok) { ok++; showMsg('img-msg', `上傳中（${ok}/${files.length}）...`, 'info'); }
        else { showMsg('img-msg', '上傳失敗', 'error'); return; }
    }
    showMsg('img-msg', `${ok} 張圖片上傳成功`, 'success');
    setTimeout(() => document.getElementById('img-msg').innerHTML = '', 4000);
    document.getElementById('fileInput').value = '';
    loadImages();
}

async function delImg(name) {
    if (!confirm('確定刪除？')) return;
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${name}`, {
        method: 'DELETE', headers: delH
    });
    if (!res.ok) { const e = await res.json().catch(()=>{}); alert('刪除失敗：' + (e?.message || res.status)); return; }
    loadImages();
}

function copyUrl(url) { navigator.clipboard.writeText(url).then(() => alert('網址已複製！')); }

// --- 工藝選集 ---
async function loadCollections() {
    const editor = document.getElementById('col-editor');
    editor.innerHTML = '<div class="placeholder">載入中...</div>';
    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/collections?order=id.asc`, {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const data = await res.json();
        if (!res.ok || !data.length) throw new Error(data.message || '載入失敗');

        editor.innerHTML = data.map(c => `
            <div class="col-card">
                <h3>Collection ${c.id} &nbsp;—&nbsp; ${c.name_zh}</h3>
                <div class="form-group">
                    <label>標籤（小字）</label>
                    <input type="text" id="tag_${c.id}" value="${c.tag}">
                </div>
                <div class="form-group">
                    <label>中文名稱</label>
                    <input type="text" id="name_zh_${c.id}" value="${c.name_zh}">
                </div>
                <div class="form-group">
                    <label>英文名稱</label>
                    <input type="text" id="name_en_${c.id}" value="${c.name_en}">
                </div>
                <div class="form-group">
                    <label>服務說明</label>
                    <textarea id="desc_${c.id}">${c.description}</textarea>
                </div>
                <div class="form-group">
                    <label>服務項目（每行一項）</label>
                    <textarea id="includes_${c.id}" style="min-height:180px;">${(c.includes||[]).join('\n')}</textarea>
                    <p class="form-hint">每一行會變成一個項目，第一行和最後一行會自動加粗標示</p>
                </div>
                <button class="save-btn" onclick="saveCollection(${c.id})">儲存第 ${c.id} 項</button>
            </div>`).join('');
    } catch(e) {
        editor.innerHTML = `<div class="placeholder" style="color:#ff6666;">載入失敗：${e.message}<br>請確認已在 Supabase 建立 collections 資料表</div>`;
    }
}

async function saveCollection(id) {
    showMsg('col-msg', '儲存中...', 'info');
    const tag = document.getElementById(`tag_${id}`).value.trim();
    const name_zh = document.getElementById(`name_zh_${id}`).value.trim();
    const name_en = document.getElementById(`name_en_${id}`).value.trim();
    const description = document.getElementById(`desc_${id}`).value.trim();
    const includesRaw = document.getElementById(`includes_${id}`).value;
    const includes = includesRaw.split('\n').map(s => s.trim()).filter(s => s.length > 0);

    const res = await fetch(`${SUPABASE_URL}/rest/v1/collections?id=eq.${id}`, {
        method: 'PATCH',
        headers: { ...sh, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ tag, name_zh, name_en, description, includes })
    });

    if (res.ok) {
        showMsg('col-msg', `Collection ${id} 已儲存，網站即時更新`, 'success');
        setTimeout(() => document.getElementById('col-msg').innerHTML = '', 4000);
    } else {
        const e = await res.json().catch(() => ({}));
        showMsg('col-msg', '儲存失敗：' + (e.message || res.status), 'error');
    }
}
</script>
</body>
</html>
