    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .booking-section {
            align-items: center;
            text-align: center;
            min-height: 100vh;
        }
        .booking-inner { max-width: 560px; }
        .booking-tag {
            font-size: 0.65rem;
            letter-spacing: 0.5rem;
            color: var(--muted);
            text-transform: uppercase;
            display: block;
            margin-bottom: 30px;
        }
        .booking-title {
            font-family: var(--font-serif);
            font-size: 3.5rem;
            font-weight: 400;
            line-height: 1.15;

        }
        .booking-desc {
            font-size: 0.95rem;
            color: var(--muted);
            line-height: 1.85;
            margin-bottom: 60px;
        }
        .line-btn {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 22px 55px;
            background: #fff;
            color: #000;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.3rem;
            text-transform: uppercase;
            font-weight: 700;
            transition: 0.4s var(--ease-silk);
        }
        .line-btn:hover { background: #e0e0e0; transform: translateY(-2px); }
        .booking-note {
            margin-top: 35px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.25);
            letter-spacing: 0.15rem;
        }
        @media (max-width: 768px) {
            .booking-title { font-size: 2.2rem; }
            .line-btn { padding: 20px 40px; font-size: 0.78rem; }
