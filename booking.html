<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私人預約 Appointments | LC MAISON</title>
    <meta name="description" content="開啟閣下的專屬美學任務。在 LC MAISON，我們提供最隱密、最專業的私人諮詢與施作預約服務。">
    <meta property="og:title" content="私人諮詢預約 | LC MAISON">
    <meta property="og:description" content="預約閣下的專屬工藝時段，體驗極致漆面校正藝術。">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .appointment-container { max-width: 800px; margin: 100px auto; padding-top: 100px; }
        .form-row { margin-bottom: 80px; }
        .form-label { font-size: 0.7rem; letter-spacing: 0.4rem; color: var(--muted); text-transform: uppercase; display: block; margin-bottom: 25px; }
        .form-input { 
            width: 100%; 
            background: transparent; 
            border: none; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding: 25px 0; 
            color: #fff; 
            font-family: var(--font-serif); 
            font-size: 1.8rem; 
            outline: none; 
            transition: 0.5s var(--ease-silk);
        }
        .form-input:focus { border-bottom-color: #fff; }
        .form-select { 
            width: 100%; 
            background: transparent; 
            border: none; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding: 25px 0; 
            color: #fff; 
            font-family: var(--font-serif); 
            font-size: 1.8rem; 
            appearance: none;
            cursor: pointer;
        }
        .form-select option { background: #000; }
        .btn-private { 
            width: 100%; 
            padding: 35px; 
            background: #fff; 
            color: #000; 
            border: none; 
            font-family: var(--font-sans); 
            font-size: 0.9rem; 
            letter-spacing: 0.6rem; 
            text-transform: uppercase; 
            cursor: pointer; 
            transition: 0.5s; 
            font-weight: 700;
        }
        .btn-private:hover { background: var(--muted); color: #fff; }
        @media (max-width: 768px) { .form-input, .form-select { font-size: 1.2rem; } }
    </style>
</head>
<body>


    <nav>
        <a href="index.html" class="brand">LC MAISON</a>
        <div class="nav-links">
            <a href="index.html" class="bilingual-link">
                <span class="bilingual-inner">
                    <span class="en">The Maison</span>
                    <span class="zh">品牌首頁</span>
                </span>
            </a>
            <a href="glow.html" class="bilingual-link">
                <span class="bilingual-inner">
                    <span class="en">Collections</span>
                    <span class="zh">工藝選集</span>
                </span>
            </a>
            <a href="drop.html" class="bilingual-link">
                <span class="bilingual-inner">
                    <span class="en">Archives</span>
                    <span class="zh">典藏實錄</span>
                </span>
            </a>
            <a href="booking.html" class="bilingual-link">
                <span class="bilingual-inner">
                    <span class="en">Appointments</span>
                    <span class="zh">私人預約</span>
                </span>
            </a>
        </div>
    </nav>

    <main>
        <section>
            <div class="appointment-container">
                <div class="reveal-maison" style="margin-bottom: 100px;">
                    <span class="bilingual-text" style="font-size: 0.8rem; letter-spacing: 0.8rem; color: var(--muted); text-transform: uppercase; display: block; margin-bottom: 30px;">
                        <span class="bilingual-inner">
                            <span class="en">Private Consultation</span>
                            <span class="zh">私人專屬預約</span>
                        </span>
                    </span>
                    <h1 class="maison-title">私人諮詢預約</h1>
                    <p class="maison-body">請留下閣下的聯繫資訊，我們的品牌顧問將於 24 小時內與您聯繫，安排專屬的美學任務時間。</p>
                </div>

                <form class="reveal-maison">
                    <div class="form-row">
                        <label class="form-label">姓名 / Name</label>
                        <input type="text" class="form-input" placeholder="如何稱呼閣下">
                    </div>
                    <div class="form-row">
                        <label class="form-label">電話 / Phone</label>
                        <input type="tel" class="form-input" placeholder="聯繫方式">
                    </div>
                    <div class="form-row">
                        <label class="form-label">車型 / Model</label>
                        <input type="text" class="form-input" placeholder="愛車型號與年份">
                    </div>
                    <div class="form-row">
                        <label class="form-label">選集 / Collection</label>
                        <select class="form-select">
                            <option>Collection 01 / 城市焦點</option>
                            <option>Collection 02 / 結晶美學</option>
                            <option>Collection 03 / 旗艦防護</option>
                        </select>
                    </div>
                    <button type="button" class="btn-private bilingual-text">
                        <span class="bilingual-inner">
                            <span class="en">Request Appointment</span>
                            <span class="zh">送出專屬預約</span>
                        </span>
                    </button>
                </form>
            </div>
        </section>
    </main>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('is-visible');
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal-maison').forEach(el => observer.observe(el));
    </script>
</body>
</html>
